<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>محصول | نوش‌آیین</title>

  <meta
    name="description"
    content="مشاهده اطلاعات و جزئیات محصول در فروشگاه نوش‌آیین"
  >

  <!-- فونت -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- استایل اصلی -->
  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="product-header">

    <div class="product-header-inner">

      <a
        href="index.html"
        class="product-brand"
      >
        نوش‌آیین
      </a>


      <a
        href="category.html?category=oils"
        class="product-back"
        id="backToCategory"
      >
        ← بازگشت به محصولات
      </a>

    </div>

  </header>



  <!-- =========================================
       PRODUCT PAGE
  ========================================== -->

  <main class="product-page">


    <!-- =======================================
         PRODUCT CONTENT
    ======================================== -->

    <section
      id="productContent"
      class="product-content"
    >

      <!--
        اطلاعات محصول توسط product.js
        اینجا قرار می‌گیرد.
      -->

      <div class="product-loading">

        <div class="loading-icon">
          🌿
        </div>

        <p>
          در حال بارگذاری محصول...
        </p>

      </div>

    </section>


  </main>



  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer class="product-footer">

    <div class="product-footer-inner">

      <div class="footer-brand">
        نوش‌آیین
      </div>

      <p>
        عطر طبیعت، طعم اصالت
      </p>

      <span>
        © نوش‌آیین
      </span>

    </div>

  </footer>



  <!-- =========================================
       CART
  ========================================== -->

  <div
    id="cartOverlay"
    class="cart-overlay"
  ></div>


  <aside
    id="cartPanel"
    class="cart-panel"
  >

    <div class="cart-header">

      <h2>
        سبد خرید
      </h2>

      <button
        id="closeCart"
        class="close-cart"
        aria-label="بستن سبد خرید"
      >
        ×
      </button>

    </div>


    <div
      id="cartItems"
      class="cart-items"
    >

      <!-- سبد خرید توسط script.js ساخته می‌شود -->

    </div>


    <div class="cart-footer">

      <div class="cart-total-row">

        <span>
          مجموع
        </span>

        <strong id="cartTotal">
          ۰ تومان
        </strong>

      </div>


      <button
        id="checkout-btn"
        class="checkout-btn"
      >
        ادامه ثبت سفارش
      </button>

    </div>

  </aside>



  <!-- =========================================
       SCRIPTS
  ========================================== -->

  <script src="script.js"></script>

  <script src="category.js"></script>

  <script src="product.js"></script>


</body>

</html>
