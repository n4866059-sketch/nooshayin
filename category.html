<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>محصولات | نوش‌آیین</title>

  <meta
    name="description"
    content="محصولات نوش‌آیین؛ چای، دمنوش، روغن، قهوه و محصولات منتخب"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <style>

    /* =================================================
       NOOSH-AYIN
       CATEGORY PAGE
    ================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top right,
          rgba(127, 24, 32, 0.12),
          transparent 35%
        ),
        #061C17;

      color: #F3E8D7;
      font-family: "Vazirmatn", sans-serif;
    }


    /* ================= HEADER ================= */

    .category-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;

      background: rgba(6, 28, 23, 0.94);

      border-bottom:
        1px solid rgba(198, 161, 91, 0.20);

      backdrop-filter: blur(14px);
    }

    .header-inner {
      width: min(1180px, 92%);
      margin: auto;

      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      color: #C6A15B;

      text-decoration: none;

      font-size: 24px;
      font-weight: 800;

      white-space: nowrap;
    }

    .header-home {
      color: #EADFCE;

      text-decoration: none;

      font-size: 13px;
      font-weight: 500;

      padding: 10px 18px;

      border: 1px solid
        rgba(198, 161, 91, 0.25);

      border-radius: 10px;

      transition: 0.25s;
    }

    .header-home:hover {
      background: #7F1820;
      color: #fff;
      border-color: #7F1820;
    }


    /* ================= CATEGORY HERO ================= */

    .category-hero {
      width: min(1180px, 92%);

      margin: 55px auto 35px;

      padding: 55px 35px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          rgba(11, 42, 34, 0.96),
          rgba(6, 28, 23, 0.96)
        );

      border:
        1px solid rgba(198, 161, 91, 0.22);

      border-radius: 24px;

      position: relative;

      overflow: hidden;
    }

    .category-hero::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background:
        rgba(127, 24, 32, 0.16);

      top: -80px;
      left: -60px;
    }

    .category-hero::after {
      content: "";

      position: absolute;

      width: 140px;
      height: 140px;

      border-radius: 50%;

      border:
        1px solid rgba(198, 161, 91, 0.12);

      bottom: -70px;
      right: -40px;
    }

    .category-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    #categoryTitle {
      margin: 0;

      color: #C6A15B;

      font-size: clamp(28px, 5vw, 44px);

      font-weight: 800;

      line-height: 1.5;
    }

    #categoryDescription {
      max-width: 720px;

      margin: 18px auto 0;

      color: #CFC5B5;

      font-size: 14px;

      line-height: 2;
    }

    .category-count {
      display: inline-block;

      margin-top: 20px;

      padding: 8px 18px;

      color: #C6A15B;

      border:
        1px solid rgba(198, 161, 91, 0.28);

      border-radius: 30px;

      font-size: 12px;
    }


    /* ================= BREADCRUMB ================= */

    .breadcrumb {
      width: min(1180px, 92%);

      margin: 0 auto 25px;

      color: #AAA49A;

      font-size: 12px;
    }

    .breadcrumb a {
      color: #C6A15B;

      text-decoration: none;
    }


    /* ================= PRODUCTS ================= */

    .products-section {
      width: min(1180px, 92%);

      margin: 0 auto 80px;
    }

    .products-heading {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 25px;

      padding-bottom: 15px;

      border-bottom:
        1px solid rgba(198, 161, 91, 0.18);
    }

    .products-heading h2 {
      margin: 0;

      color: #C6A15B;

      font-size: 20px;
    }

    #productsCount {
      color: #AAA49A;

      font-size: 12px;
    }


    /* =================================================
       ONE PRODUCT PER ROW
    ================================================= */

    .products-grid {

      display: flex;

      flex-direction: column;

      gap: 24px;
    }


    /* ================= PRODUCT ROW ================= */

    .product-card {

      width: 100%;

      display: grid;

      grid-template-columns:
        300px
        minmax(0, 1fr);

      min-height: 300px;

      background:
        linear-gradient(
          135deg,
          #0B2A22,
          #071F19
        );

      border:
        1px solid rgba(198, 161, 91, 0.20);

      border-radius: 20px;

      overflow: hidden;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .product-card:hover {

      transform: translateY(-3px);

      border-color:
        rgba(198, 161, 91, 0.48);

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.25);
    }


    /* ================= PRODUCT IMAGE ================= */

    .product-image {

      min-height: 300px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(198, 161, 91, 0.08),
          transparent 65%
        );

      border-left:
        1px solid rgba(198, 161, 91, 0.12);

      cursor: pointer;
    }

    .product-image img {

      width: 100%;
      height: 100%;

      min-height: 300px;

      object-fit: contain;

      padding: 25px;

      display: block;

      transition:
        transform 0.35s ease;
    }

    .product-card:hover
    .product-image img {

      transform: scale(1.035);
    }


    /* ================= PRODUCT INFORMATION ================= */

    .product-info {

      padding: 28px 32px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    .product-category {

      color: #C6A15B;

      font-size: 11px;

      font-weight: 500;

      margin-bottom: 8px;
    }


    .product-name {

      margin: 0 0 18px;

      color: #F3E8D7;

      font-size: 23px;

      font-weight: 700;

      line-height: 1.7;
    }


    /* ================= DETAILS ================= */

    .product-details {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 18px;
    }

    .product-detail {

      padding: 12px;

      background:
        rgba(6, 28, 23, 0.65);

      border:
        1px solid rgba(198, 161, 91, 0.12);

      border-radius: 10px;
    }

    .product-detail span {

      display: block;

      color: #8F887D;

      font-size: 10px;

      margin-bottom: 5px;
    }

    .product-detail strong {

      color: #C6A15B;

      font-size: 12px;

      font-weight: 600;
    }


    /* ================= DESCRIPTION ================= */

    .product-description {

      padding:

        15px 0;

      margin-bottom: 15px;

      border-top:
        1px solid rgba(198, 161, 91, 0.12);

      border-bottom:
        1px solid rgba(198, 161, 91, 0.12);

      color: #CFC5B5;

      font-size: 12px;

      line-height: 2;
    }


    /* ================= BOTTOM ================= */

    .product-bottom {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .product-price {

      color: #C6A15B;

      font-size: 21px;

      font-weight: 800;

      white-space: nowrap;
    }


    .product-link {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 170px;

      height: 45px;

      padding: 0 20px;

      background: #7F1820;

      color: #F3E8D7;

      border-radius: 10px;

      text-decoration: none;

      font-size: 12px;

      font-weight: 600;

      transition: 0.25s;
    }

    .product-link:hover {

      background: #A3242C;

      transform: translateY(-2px);
    }


    /* ================= EMPTY ================= */

    .products-empty {

      padding: 70px 20px;

      text-align: center;

      color: #AAA49A;

      border:
        1px dashed rgba(198, 161, 91, 0.25);

      border-radius: 20px;
    }


    /* ================= MOBILE ================= */

    @media (max-width: 800px) {

      .header-inner {
        min-height: 68px;
      }

      .brand {
        font-size: 20px;
      }

      .header-home {
        font-size: 11px;
        padding: 8px 13px;
      }

      .category-hero {
        margin-top: 30px;

        padding: 40px 20px;
      }

      .category-icon {
        font-size: 34px;
      }

      #categoryDescription {
        font-size: 12px;
      }

      .product-card {

        grid-template-columns: 1fr;

        min-height: 0;
      }

      .product-image {

        min-height: 300px;

        border-left: none;

        border-bottom:
          1px solid rgba(198, 161, 91, 0.12);
      }

      .product-image img {

        min-height: 300px;

        max-height: 360px;

        padding: 25px;
      }

      .product-info {

        padding: 22px;
      }

      .product-name {

        font-size: 19px;
      }

      .product-details {

        grid-template-columns:
          repeat(2, 1fr);
      }

      .product-bottom {

        flex-direction: column;

        align-items: stretch;
      }

      .product-price {

        text-align: center;
      }

      .product-link {

        width: 100%;
      }
    }


    @media (max-width: 430px) {

      .products-section,
      .category-hero,
      .breadcrumb {

        width: 94%;
      }

      .product-image {

        min-height: 260px;
      }

      .product-image img {

        min-height: 260px;

        padding: 18px;
      }

      .product-info {

        padding: 18px;
      }

      .product-details {

        grid-template-columns: 1fr 1fr;
      }

      .product-name {

        font-size: 17px;
      }

      .product-price {

        font-size: 18px;
      }
    }

  </style>

</head>


<body>


  <!-- ================= HEADER ================= -->

  <header class="category-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
      >
        نوش‌آیین
      </a>

      <a
        href="index.html"
        class="header-home"
      >
        ← بازگشت به خانه
      </a>

    </div>

  </header>


  <!-- ================= CATEGORY HERO ================= -->

  <section class="category-hero">

    <div class="category-icon">
      🌿
    </div>

    <h1 id="categoryTitle">
      محصولات نوش‌آیین
    </h1>

    <p id="categoryDescription">
      مجموعه‌ای از محصولات منتخب نوش‌آیین
    </p>

    <div class="category-count">

      <span id="categoryCount">
        محصولات

      </span>

    </div>

  </section>


  <!-- ================= BREADCRUMB ================= -->

  <div class="breadcrumb">

    <a href="index.html">
      خانه
    </a>

    <span>
      &nbsp; / &nbsp;
    </span>

    <span id="breadcrumbCategory">
      محصولات
    </span>

  </div>


  <!-- ================= PRODUCTS ================= -->

  <main class="products-section">

    <div class="products-heading">

      <h2>
        محصولات این دسته
      </h2>

      <span id="productsCount">
        در حال بارگذاری...
      </span>

    </div>


    <div
      id="productsGrid"
      class="products-grid"
    >

      <!-- محصولات توسط category.js ساخته می‌شوند -->

    </div>

  </main>


  <!-- ================= SCRIPTS ================= -->

  <script src="script.js"></script>

  <script src="category.js"></script>


</body>

</html>
